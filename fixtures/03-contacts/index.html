<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two contacts</title>
<link rel="stylesheet" href="style.css">
<script src="trusted.js" defer>
</script>
</head>
<body>
<main>
<h1>Two contacts</h1>
<form>
<div class="field">
<strong>Primary email</strong>
<input id="primary" name="primary" type="email">
</div>
<div class="field">
<strong>Backup email</strong>
<input id="backup" name="backup" type="email">
</div>
<button id="submit" type="submit">Save request</button>
</form>
<output id="status" aria-live="polite">Ready</output>
</main>
</body>
</html>
