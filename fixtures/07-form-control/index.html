<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optional reminder</title>
<link rel="stylesheet" href="style.css">
<script src="trusted.js" defer>
</script>
</head>
<body>
<main>
<h1>Optional reminder</h1>
<form>
<div class="field">
<label for="name">Your name</label>
<input id="name" name="name">
</div>
<span id="remind" class="action" data-action="remind">Add reminder</span>
<button id="submit" type="submit">Save request</button>
</form>
<output id="status" aria-live="polite">Ready</output>
</main>
</body>
</html>
