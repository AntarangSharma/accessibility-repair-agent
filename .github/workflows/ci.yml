name: Verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.9'
      - run: make setup
      - run: npx --no-install playwright install-deps chromium
      - run: make check
      - run: make test
      - run: make eval-fixtures
      - run: uv run --frozen python scripts/assert_fixture_eval.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: reports/
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: make docker-smoke
